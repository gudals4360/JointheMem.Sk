<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 방식 선택</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/signup-entry.css">
  <script src="../js/common.js" defer></script>
  <script src="../js/signup-entry.js" defer></script>
</head>
<body>
<main class="screen">
  <header class="app-bar">
    <a class="icon-btn" href="../index.html" aria-label="이전으로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1>회원가입</h1>
    <span class="step">1/4</span>
  </header>
  <div class="bar" role="progressbar" aria-valuemin="1" aria-valuemax="4" aria-valuenow="1" aria-label="가입 방식 선택, 1 / 4 단계"><i style="width:25%"></i></div>

  <section class="intro">
    <h2>어떤 방법으로<br>가입하시겠어요?</h2>
    <p>신세계면세점 회원이 되어 쇼핑 혜택을 이용해 보세요.</p>
  </section>

  <div class="content">
    <a class="btn btn-primary" href="./verification.html">신세계포인트 통합회원 가입</a>
    <p class="caption">하나의 ID로 통합회원 서비스를 이용해요</p>

    <button class="btn btn-outline" type="button" data-method="외국인 회원가입">외국인 회원가입 · Join as a foreigner</button>

    <div class="divider"><span>SNS로 간편 가입</span></div>
    <button class="btn btn-kakao" type="button" data-method="카카오 간편가입">카카오로 가입</button>
    <button class="btn btn-outline" type="button" data-method="앱카드 간편가입">앱카드로 가입</button>
    <p class="caption">가입 방식에 따라 추가 인증이 필요할 수 있어요</p>
  </div>
  <p class="proto">UX 검증용 프로토타입이에요. 실제 가입은 진행되지 않아요.</p>
</main>
</body>
</html>
