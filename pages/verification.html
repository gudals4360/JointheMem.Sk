<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>본인 인증</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/verification.css">
  <script src="../js/common.js" defer></script>
  <script src="../js/verification.js" defer></script>
</head>
<body>
<main class="screen">
  <header class="app-bar">
    <a class="icon-btn" href="./signup-entry.html" aria-label="가입 방식 선택으로 돌아가기"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1>회원가입</h1>
    <span class="step">2/4</span>
  </header>
  <div class="bar" role="progressbar" aria-valuemin="1" aria-valuemax="4" aria-valuenow="2" aria-label="본인 인증, 2 / 4 단계"><i style="width:50%"></i></div>

  <section class="intro">
    <p class="eyebrow">본인 인증</p>
    <h2>본인 인증 방법을<br>선택해 주세요</h2>
    <p>안전한 회원가입을 위해 본인 확인이 필요해요.</p>
  </section>

  <form class="content" id="verification-form">
    <fieldset>
      <legend class="sr-only">인증 방법 선택</legend>
      <label class="row"><input type="radio" name="verification" value="phone">
        <span class="txt"><b>휴대폰 인증</b><small>본인 명의 휴대폰으로 인증해요</small></span><span class="radio" aria-hidden="true"></span></label>
      <label class="row"><input type="radio" name="verification" value="certificate">
        <span class="txt"><b>신한인증서</b><small>신한인증서로 본인을 확인해요</small></span><span class="radio" aria-hidden="true"></span></label>
      <label class="row"><input type="radio" name="verification" value="card">
        <span class="txt"><b>카드 인증</b><small>지원되는 카드로 본인을 확인해요</small></span><span class="radio" aria-hidden="true"></span></label>
    </fieldset>
    <p class="caption">가입 유형에 따라 이용 가능한 방법이 다를 수 있어요</p>

    <div class="bottom">
      <button class="btn-primary" id="continue-button" type="submit" disabled>인증 방법을 선택해 주세요</button>
      <p class="proto">프로토타입이에요. 실제 인증 없이 다음 화면으로 이동해요.</p>
    </div>
  </form>
</main>
</body>
</html>
